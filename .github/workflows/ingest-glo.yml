name: Ingest Thai GLO Results

on:
  schedule:
    - cron: '45 8 1,16 * *'
  workflow_dispatch:
    inputs:
      draw_date:
        description: 'Published draw date (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ingest GLO result
        run: npm run ingest:glo
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRAW_DATE: ${{ inputs.draw_date }}
      - name: Commit prediction for the next draw
        run: npm run generate:proof
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Announce draw results (no-ops until LINE/Facebook are configured)
        run: npm run announce:draw
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRAW_DATE: ${{ inputs.draw_date }}
          SITE_URL: ${{ vars.SITE_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      - name: Generate SEO recap page for this draw
        run: npm run generate:draw-page
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRAW_DATE: ${{ inputs.draw_date }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit generated recap page (no-op if nothing changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/draws public/sitemap.xml
          # Intentionally NOT using [skip ci]: this push must trigger deploy.yml so the new recap page actually goes live.
          git diff --cached --quiet && echo "No new content to commit." || git commit -m "Add SEO recap page for the ${DRAW_DATE:-latest} Thai draw"
          git push
        env:
          DRAW_DATE: ${{ inputs.draw_date }}
