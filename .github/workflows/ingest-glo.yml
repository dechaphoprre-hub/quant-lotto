name: Ingest Thai GLO Results

on:
  schedule:
    - cron: '45 8 1,16 * *'
  workflow_dispatch:
    inputs:
      draw_date:
        description: 'Published draw date (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ingest GLO result
        run: npm run ingest:glo
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRAW_DATE: ${{ inputs.draw_date }}
      - name: Commit prediction for the next draw
        run: npm run generate:proof
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
